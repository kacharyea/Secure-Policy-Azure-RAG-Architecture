<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1240" viewBox="0 0 1440 1240" style="max-width:1440px;width:100%;height:auto" role="img" aria-labelledby="title description">
  <title id="title">Secure Policy RAG: Azure resource and identity layout</title>
  <desc id="description">Entra applications and groups are tenant-level objects outside the resource group. One Azure resource group contains optional App Service and plan, API Management, a Foundry account and project with two model deployments, runtime and indexer managed identities, Search, and Blob Storage. Local certificate identities and the separately invoked indexer are distinct from hosted resources.</desc>
  <defs>
    <linearGradient id="header" x2="1" y2="0">
      <stop stop-color="#10233f"/>
      <stop offset="1" stop-color="#174d70"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#173553" flood-opacity=".08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#087f8c"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #17314f; }
      .title { font-size: 34px; font-weight: 700; fill: white; }
      .subtitle { font-size: 18px; fill: #d3e6f4; }
      .heading { font-size: 21px; font-weight: 700; }
      .body { font-size: 17px; fill: #435b73; }
      .small { font-size: 15px; fill: #526981; }
      .label { font-size: 14px; font-weight: 700; letter-spacing: 1.2px; fill: #426284; }
      .card { fill: white; stroke: #d4dfeb; stroke-width: 1.5; filter: url(#shadow); }
      .optional { fill: white; stroke: #7185b8; stroke-width: 2; stroke-dasharray: 7 5; }
      .link { fill: none; stroke: #087f8c; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1440" height="1240" rx="20" fill="#f3f7fc"/>
  <path d="M20 0H1420Q1440 0 1440 20V132H0V20Q0 0 20 0" fill="url(#header)"/>
  <text x="48" y="58" class="title">One sample. Separate identity and resource planes.</text>
  <text x="48" y="96" class="subtitle">RESOURCE LAYOUT  /  Customer-neutral names. Least-privilege service access.</text>

  <rect x="48" y="164" width="1344" height="218" rx="18" fill="#efedf9" stroke="#cec6e7"/>
  <text x="72" y="198" class="heading">Microsoft Entra tenant</text>
  <text x="1368" y="198" text-anchor="end" class="small">Directory objects / outside the resource group lifecycle</text>
  <rect x="72" y="222" width="300" height="134" rx="12" class="card"/>
  <text x="92" y="252" class="heading">Browser + API apps</text>
  <text x="92" y="281" class="body">SPA client and API resource</text>
  <text x="92" y="307" class="body">PolicyReview.Invoke scope</text>
  <text x="92" y="333" class="small">User-specific delegated consent</text>
  <rect x="404" y="222" width="300" height="134" rx="12" class="card"/>
  <text x="424" y="252" class="heading">Gateway resource app</text>
  <text x="424" y="281" class="body">ModelGateway.Invoke role</text>
  <text x="424" y="307" class="body">Assigned to runtime + indexer</text>
  <text x="424" y="333" class="small">App-only service access to APIM</text>
  <rect x="736" y="222" width="300" height="134" rx="12" class="card"/>
  <text x="756" y="252" class="heading">Security groups</text>
  <text x="756" y="281" class="body">Employees / security reviewers</text>
  <text x="756" y="307" class="body">Approved user memberships</text>
  <text x="756" y="333" class="small">Mapped to document entitlements</text>
  <rect x="1068" y="222" width="300" height="134" rx="12" class="optional"/>
  <text x="1088" y="252" class="heading">Local service apps</text>
  <text x="1088" y="281" class="body">Runtime and indexer identities</text>
  <text x="1088" y="307" class="body">Separate certificate credentials</text>
  <text x="1088" y="333" class="small">Optional / private keys stay local</text>

  <rect x="48" y="414" width="1344" height="520" rx="18" fill="#eaf2fc" stroke="#afc7e2" stroke-width="2"/>
  <text x="72" y="447" class="heading">Azure subscription</text>
  <text x="1368" y="447" text-anchor="end" class="small">main.bicep creates the resource group and service modules</text>
  <rect x="72" y="469" width="1296" height="440" rx="15" fill="#f8fbff" stroke="#c7d7e8" stroke-dasharray="8 5"/>
  <text x="96" y="500" class="label">RESOURCE GROUP / rg-secure-policy-rag (CONFIGURABLE)</text>

  <rect x="96" y="523" width="384" height="148" rx="13" class="optional"/>
  <text x="118" y="557" class="heading">App Service + hosting plan</text>
  <text x="118" y="587" class="body">Optional Windows / Basic B1</text>
  <text x="118" y="614" class="body">Same-origin UI + .NET API</text>
  <text x="118" y="643" class="small">Uses the runtime user-assigned identity</text>

  <rect x="516" y="523" width="384" height="148" rx="13" class="card"/>
  <rect x="516" y="523" width="7" height="148" rx="3" fill="#087f8c"/>
  <text x="540" y="557" class="heading">API Management</text>
  <text x="540" y="587" class="body">Consumption / model gateway</text>
  <text x="540" y="614" class="body">Signed app-role token validation</text>
  <text x="540" y="643" class="small">System identity: OpenAI User on Foundry</text>

  <rect x="936" y="523" width="408" height="148" rx="13" class="card"/>
  <rect x="936" y="523" width="7" height="148" rx="3" fill="#7057bd"/>
  <text x="960" y="557" class="heading">Microsoft Foundry</text>
  <text x="960" y="587" class="body">AIServices S0 account + project</text>
  <text x="960" y="614" class="body">gpt-5-mini / text-embedding-3-small</text>
  <text x="960" y="643" class="small">Model calls use APIM, not a hosted agent</text>
  <path d="M480 597H516" class="link"/>
  <path d="M900 597H936" class="link"/>

  <rect x="96" y="711" width="384" height="148" rx="13" class="card"/>
  <text x="118" y="745" class="heading">Managed identities</text>
  <text x="118" y="775" class="body">id-policy-runtime: Search reader</text>
  <text x="118" y="802" class="body">id-policy-indexer: schema + data writes</text>
  <text x="118" y="831" class="small">Both receive gateway role; indexer reads Blob</text>

  <rect x="516" y="711" width="384" height="148" rx="13" class="card"/>
  <rect x="516" y="711" width="7" height="148" rx="3" fill="#1763ad"/>
  <text x="540" y="745" class="heading">Azure AI Search</text>
  <text x="540" y="775" class="body">Basic / policy-chunks index</text>
  <text x="540" y="802" class="body">Text + vectors + allowedGroups</text>
  <text x="540" y="831" class="small">Permission filter enforced at query time</text>

  <rect x="936" y="711" width="408" height="148" rx="13" class="card"/>
  <rect x="936" y="711" width="7" height="148" rx="3" fill="#d39120"/>
  <text x="960" y="745" class="heading">Azure Blob Storage</text>
  <text x="960" y="775" class="body">Standard LRS / policy-documents</text>
  <text x="960" y="802" class="body">Private container / optional source path</text>
  <text x="960" y="831" class="small">Approved uploader writes; indexer reads</text>
  <text x="96" y="889" class="small">Arrows show the hosted inference path. Dashed cards are optional. Search may use a different configured region.</text>

  <rect x="48" y="968" width="652" height="196" rx="16" class="card"/>
  <text x="72" y="1003" class="heading">Alternative: run the application locally</text>
  <text x="72" y="1036" class="body">Fixture mode: no Azure calls; synthetic identities by default.</text>
  <text x="72" y="1065" class="body">Entra + fixture: real user identity, local retrieval and answers.</text>
  <text x="72" y="1094" class="body">Azure mode: live services, certificate-backed local backend.</text>
  <text x="72" y="1133" class="small">Endpoints and IDs are configuration, not authentication credentials.</text>

  <rect x="724" y="968" width="668" height="196" rx="16" fill="#e5f4f2" stroke="#b6dcd7"/>
  <text x="748" y="1003" class="heading">Separate ingestion / explicit indexer command</text>
  <text x="748" y="1036" class="body">Approved manifest OR verified Blob sources</text>
  <text x="748" y="1065" class="body">Indexer -&gt; APIM embeddings -&gt; ACL-tagged chunks in Search</text>
  <text x="748" y="1094" class="body">API startup never uploads or indexes documents.</text>
  <text x="748" y="1133" class="small">A .NET executable, not an automatically deployed compute service.</text>
  <text x="48" y="1206" class="small">Sample posture: public service endpoints, local keys disabled, no VNet/private endpoints. Directory objects survive resource group deletion.</text>
</svg>
